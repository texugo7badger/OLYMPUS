<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OLYMPUS integration build category">
  <defs>
    <style>
      .spin { transform-origin: 48px 48px; animation: spin 14s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.8s ease-in-out infinite; animation-delay: .6s; }
      .travel { animation: travel 3.2s ease-in-out infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes travel { 0%,100% { transform: translate(0,0); opacity: .4; } 50% { transform: translate(0,-18px); opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateY(-10px); opacity: .25; } 50% { transform: translateY(12px); opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .spin,.pulse,.pulse2,.travel,.scan { animation: none; } }
    </style>
  </defs>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#6BAE9B" stroke-width="1" opacity=".22"/>
  <g stroke="#6BAE9B" stroke-width="2" opacity=".55"><path d="M26 66 L48 48 L70 66"/><path d="M48 48 V22"/></g><circle class="pulse" cx="48" cy="22" r="5" fill="#D4A574"/><circle class="pulse2" cx="26" cy="66" r="4" fill="#6BAE9B"/><circle class="pulse2" cx="70" cy="66" r="4" fill="#6BAE9B"/><circle class="travel" cx="48" cy="48" r="3.4" fill="#6BAEB5"/>
</svg>
