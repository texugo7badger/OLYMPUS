  @keyframes twinkle-b{0%{opacity:0.8} 100%{opacity:0.25}}
  .twinkle-b{animation-name:twinkle-b;animation-duration:5.8s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
  @keyframes twinkle-c{0%{opacity:0.3} 100%{opacity:0.85}}
  .twinkle-c{animation-name:twinkle-c;animation-duration:4.8s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
    @media (prefers-reduced-motion: reduce){.spin-slow,.spin-rev,.spin-fast,.breathe,.pulse,.twinkle-a,.twinkle-b,.twinkle-c{animation:none!important}}
