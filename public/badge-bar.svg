<?xml version="1.0" encoding="UTF-8"?>
<!--
  OLYMPUS badge bar — v0.0.23.
  Minimalist by design: one accent (gold), four stable facts, no gradients,
  no glow, no stale counters. Version / license / arsenal / lanes.
-->
<svg width="560" height="40" viewBox="0 0 560 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OLYMPUS v0.0.23 — AGPL-3.0 — 10 gods and 122 demigods — GO, Zen, Local">
  <rect x="1" y="1" width="558" height="38" rx="8" fill="#0F1419" stroke="#D4A574" stroke-opacity="0.18" />

  <g font-family="'SF Mono', Monaco, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="0.4">
    <!-- version -->
    <a href="https://github.com/texugo7badger/olympus/releases" target="_blank">
      <text x="18" y="25" fill="#D4A574" font-weight="600">v0.0.23</text>
    </a>

    <line x1="86" y1="12" x2="86" y2="28" stroke="#D4A574" stroke-opacity="0.14" />

    <!-- license -->
    <a href="https://github.com/texugo7badger/olympus/blob/main/LICENSE" target="_blank">
      <text x="102" y="25" fill="#8B8F98">AGPL-3.0</text>
    </a>

    <line x1="178" y1="12" x2="178" y2="28" stroke="#D4A574" stroke-opacity="0.14" />

    <!-- arsenal -->
    <text x="194" y="25" fill="#8B8F98">10 gods · 122 demigods</text>

    <line x1="362" y1="12" x2="362" y2="28" stroke="#D4A574" stroke-opacity="0.14" />

    <!-- lanes -->
    <text x="378" y="25" fill="#D4A574" fill-opacity="0.75">GO · ZEN · LOCAL</text>
  </g>
</svg>
