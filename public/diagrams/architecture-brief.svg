<svg width="1200" height="590" viewBox="0 0 1200 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="THREE LAYERS, ONE WINDOW — the brief architecture — desktop, server, agents">
  <rect width="1200" height="590" rx="18" fill="#0B0C10"/>
  <rect x="0.5" y="0.5" width="1199" height="589" rx="18" stroke="#2A2E38"/>
  <text x="40" y="52" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700" letter-spacing="1">THREE LAYERS, ONE WINDOW</text>
  <text x="40" y="76" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="11">the brief architecture — desktop, server, agents</text>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#2A2E38"/>
  <rect x="40" y="120" width="1120" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="40" y="120" width="3" height="110" rx="1.5" fill="#D4A574"/>
  <text x="56" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">ELECTRON MAIN · electron/main.ts</text>
  <text x="56" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">spawns the Next server on localhost:3737 · native BrowserWindow (1600×1000)</text>
  <text x="56" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">webview for embedded frames · IPC bridge · window/tray/dock icons</text>
  <line x1="600" y1="230" x2="600" y2="266" stroke="#D4A574" stroke-width="1.2"/><path d="M 600 266 l -6 -3 l 0 6 z" fill="#D4A574"/>
  <rect x="40" y="266" width="1120" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="40" y="266" width="3" height="110" rx="1.5" fill="#67C9E8"/>
  <text x="56" y="292" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">NEXT SERVER · localhost:3737</text>
  <text x="56" y="314" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">API routes: /api/olympus/* · /api/vault/* · /api/symphony/*</text>
  <text x="56" y="332" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">SSE streams + WebSocket bridge (:3738) · React 19 + Next.js 16</text>
  <line x1="600" y1="376" x2="600" y2="412" stroke="#67C9E8" stroke-width="1.2"/><path d="M 600 412 l -6 -3 l 0 6 z" fill="#67C9E8"/>
