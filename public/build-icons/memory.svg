<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OLYMPUS memory build category">
  <defs>
    <style>
      .spin { transform-origin: 48px 48px; animation: spin 14s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.8s ease-in-out infinite; animation-delay: .6s; }
      .travel { animation: travel 3.2s ease-in-out infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes travel { 0%,100% { transform: translate(0,0); opacity: .4; } 50% { transform: translate(0,-18px); opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateY(-10px); opacity: .25; } 50% { transform: translateY(12px); opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .spin,.pulse,.pulse2,.travel,.scan { animation: none; } }
    </style>
  </defs>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#D4A574" stroke-width="1" opacity=".22"/>
  <g fill="none" stroke="#D4A574" stroke-width="2.2" stroke-linecap="round"><path class="pulse" d="M28 52 C28 34 40 24 48 24 C60 24 68 34 68 44"/><path class="pulse2" d="M24 60 C24 38 38 28 48 28 C64 28 72 40 72 52"/><path d="M32 62 C34 46 42 38 48 38 C58 38 64 46 64 56"/></g><circle class="pulse" cx="48" cy="60" r="4" fill="#9B7BAE"/>
</svg>
