<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="OLYMPUS stardrift loader: the theme's light fills the peak">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B12"/><stop offset="1" stop-color="#0D1220"/></linearGradient>
    <linearGradient id="lfill" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D4A574"/><stop offset="0.52" stop-color="#9B7BAE"/><stop offset="1" stop-color="#6BAEB5"/></linearGradient>
    <radialGradient id="laura" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6BAEB5" stop-opacity="0.20"/><stop offset="1" stop-color="#6BAEB5" stop-opacity="0"/></radialGradient>
    <clipPath id="c30"><rect x="0" y="330" width="512" height="150"/></clipPath>
    <clipPath id="c60"><rect x="0" y="240" width="512" height="240"/></clipPath>
    <clipPath id="c100"><rect x="0" y="0" width="512" height="512"/></clipPath>
    <style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.dim{fill:#8A93A6}.gold{fill:#D4A574}.cyan{fill:#6BAEB5}</style>
  </defs>
  <rect width="1200" height="440" fill="url(#lbg)"/>
  <text x="40" y="46" class="t gold" font-size="14" letter-spacing="5">OLYMPUS · THE DEFAULT LOADER</text>
  <text x="40" y="70" class="t dim" font-size="10">a sphere of stars drifts around the peak; the theme's light fills it as the app loads</text>

  <g transform="translate(80 100)">
    <circle cx="150" cy="150" r="150" fill="url(#laura)"/>
    <circle cx="150" cy="150" r="140" fill="none" stroke="#6BAEB544"/>
    <g fill="#D4A574"><circle cx="60" cy="90" r="2"/><circle cx="220" cy="70" r="2.4"/><circle cx="250" cy="190" r="1.8"/><circle cx="90" cy="230" r="2"/><circle cx="180" cy="250" r="1.6"/><circle cx="270" cy="130" r="1.4"/></g>
    <g fill="#9B7BAE"><circle cx="40" cy="160" r="1.6"/><circle cx="150" cy="40" r="1.8"/><circle cx="250" cy="240" r="1.6"/></g>
    <g fill="#6BAEB5"><circle cx="70" cy="120" r="1.4"/><circle cx="200" cy="220" r="1.6"/><circle cx="230" cy="60" r="1.4"/></g>
    <g transform="translate(150 150) scale(0.34) translate(-256 -256)">
      <path d="M256 96 L372 372 L316 372 L256 236 L196 372 L140 372 Z" fill="none" stroke="#D4A574" stroke-opacity="0.22" stroke-width="10" stroke-linejoin="round"/>
      <path d="M256 96 L372 372 L316 372 L256 236 L196 372 L140 372 Z" fill="url(#lfill)" fill-opacity="0.92" clip-path="url(#c30)"/>
    </g>
    <text x="150" y="330" class="t dim" font-size="10" text-anchor="middle">30% · compiling</text>
  </g>

  <g transform="translate(480 100)">
    <circle cx="150" cy="150" r="150" fill="url(#laura)"/>
    <circle cx="150" cy="150" r="140" fill="none" stroke="#6BAEB544"/>
    <g fill="#D4A574"><circle cx="60" cy="90" r="2"/><circle cx="220" cy="70" r="2.4"/><circle cx="250" cy="190" r="1.8"/><circle cx="90" cy="230" r="2"/><circle cx="180" cy="250" r="1.6"/><circle cx="270" cy="130" r="1.4"/></g>
    <g fill="#9B7BAE"><circle cx="40" cy="160" r="1.6"/><circle cx="150" cy="40" r="1.8"/><circle cx="250" cy="240" r="1.6"/></g>
    <g fill="#6BAEB5"><circle cx="70" cy="120" r="1.4"/><circle cx="200" cy="220" r="1.6"/><circle cx="230" cy="60" r="1.4"/></g>
    <g transform="translate(150 150) scale(0.34) translate(-256 -256)">
      <path d="M256 96 L372 372 L316 372 L256 236 L196 372 L140 372 Z" fill="none" stroke="#D4A574" stroke-opacity="0.22" stroke-width="10" stroke-linejoin="round"/>
      <path d="M256 96 L372 372 L316 372 L256 236 L196 372 L140 372 Z" fill="url(#lfill)" fill-opacity="0.92" clip-path="url(#c60)"/>
      <line x1="120" y1="240" x2="392" y2="240" stroke="#6BAEB5" stroke-opacity="0.55" stroke-width="3"/>
    </g>
    <text x="150" y="330" class="t dim" font-size="10" text-anchor="middle">60% · data ready</text>
  </g>

  <g transform="translate(880 100)">
    <circle cx="150" cy="150" r="150" fill="url(#laura)"/>
    <circle cx="150" cy="150" r="140" fill="none" stroke="#6BAEB544"/>
    <g fill="#D4A574"><circle cx="60" cy="90" r="2"/><circle cx="220" cy="70" r="2.4"/><circle cx="250" cy="190" r="1.8"/><circle cx="90" cy="230" r="2"/><circle cx="180" cy="250" r="1.6"/><circle cx="270" cy="130" r="1.4"/></g>
    <g fill="#9B7BAE"><circle cx="40" cy="160" r="1.6"/><circle cx="150" cy="40" r="1.8"/><circle cx="250" cy="240" r="1.6"/></g>
    <g fill="#6BAEB5"><circle cx="70" cy="120" r="1.4"/><circle cx="200" cy="220" r="1.6"/><circle cx="230" cy="60" r="1.4"/></g>
    <g transform="translate(150 150) scale(0.34) translate(-256 -256)">
      <path d="M256 96 L372 372 L316 372 L256 236 L196 372 L140 372 Z" fill="url(#lfill)" fill-opacity="0.95" clip-path="url(#c100)"/>
    </g>
    <text x="150" y="330" class="t cyan" font-size="10" text-anchor="middle">100% · the pantheon is awake</text>
  </g>
  <text x="600" y="400" class="t dim" font-size="9" text-anchor="middle">same loader on PC and phone · stable mode draws a static constellation · 60 FPS</text>
</svg>
