<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FIVE STEPS TO THE FIRST PROMPT — download → run → connect → open → ask">
  <rect width="1200" height="360" rx="18" fill="#0B0C10"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" stroke="#2A2E38"/>
  <text x="40" y="52" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700" letter-spacing="1">FIVE STEPS TO THE FIRST PROMPT</text>
  <text x="40" y="76" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="11">download → run → connect → open → ask</text>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#2A2E38"/>
  <rect x="40" y="120" width="200" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="40" y="120" width="3" height="110" rx="1.5" fill="#D4A574"/>
  <text x="56" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">1 · DOWNLOAD</text>
  <text x="56" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">the AppImage from</text>
  <text x="56" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">GitHub Releases</text>
  <line x1="240" y1="175" x2="275" y2="175" stroke="#2A2E38" stroke-width="1.2"/><path d="M 275 175 l -6 -3 l 0 6 z" fill="#2A2E38"/>
  <rect x="275" y="120" width="200" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="275" y="120" width="3" height="110" rx="1.5" fill="#D4A574"/>
  <text x="291" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">2 · RUN</text>
  <text x="291" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">chmod +x</text>
  <text x="291" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">./OLYMPUS-*.AppImage</text>
  <line x1="475" y1="175" x2="510" y2="175" stroke="#2A2E38" stroke-width="1.2"/><path d="M 510 175 l -6 -3 l 0 6 z" fill="#2A2E38"/>
  <rect x="510" y="120" width="220" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="510" y="120" width="3" height="110" rx="1.5" fill="#67C9E8"/>
  <text x="526" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">3 · CONNECT</text>
  <text x="526" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">olympus opencode</text>
  <text x="526" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">/connect → GO or Zen</text>
  <line x1="730" y1="175" x2="765" y2="175" stroke="#2A2E38" stroke-width="1.2"/><path d="M 765 175 l -6 -3 l 0 6 z" fill="#2A2E38"/>
  <rect x="765" y="120" width="200" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="765" y="120" width="3" height="110" rx="1.5" fill="#67C9E8"/>
  <text x="781" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">4 · OPEN</text>
  <text x="781" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">the window opens</text>
  <text x="781" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">no terminal needed</text>
  <line x1="965" y1="175" x2="1000" y2="175" stroke="#2A2E38" stroke-width="1.2"/><path d="M 1000 175 l -6 -3 l 0 6 z" fill="#2A2E38"/>
  <rect x="1000" y="120" width="160" height="110" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="1000" y="120" width="3" height="110" rx="1.5" fill="#9CC48E"/>
  <text x="1016" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">5 · ASK</text>
  <text x="1016" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">type or hold</text>
  <text x="1016" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">the mic</text>
  <text x="40" y="270" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">Local lane: no subscription — point OLYMPUS at your own Ollama / LM Studio / vLLM / llama.cpp (LOCAL-LLM.md).</text>
  <text x="40" y="294" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">From source: git clone → bash scripts/install/install.sh → npm run dev.</text>
  <rect x="40" y="316" width="312" height="20" rx="10" fill="#E8A45C22" stroke="#E8A45C55"/><text x="48" y="330" fill="#E8A45C" font-family="'JetBrains Mono',monospace" font-size="9.5">no API key field: keys live in OpenCode auth.json</text>
  <rect x="420" y="316" width="200" height="20" rx="10" fill="#9CC48E22" stroke="#9CC48E55"/><text x="428" y="330" fill="#9CC48E" font-family="'JetBrains Mono',monospace" font-size="9.5">auto-update via GitHub Releases</text>
</svg>
