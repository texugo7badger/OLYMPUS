<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OLYMPUS security build category">
  <defs>
    <style>
      .spin { transform-origin: 48px 48px; animation: spin 14s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.8s ease-in-out infinite; animation-delay: .6s; }
      .travel { animation: travel 3.2s ease-in-out infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes travel { 0%,100% { transform: translate(0,0); opacity: .4; } 50% { transform: translate(0,-18px); opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateY(-10px); opacity: .25; } 50% { transform: translateY(12px); opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .spin,.pulse,.pulse2,.travel,.scan { animation: none; } }
    </style>
  </defs>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#C4756A" stroke-width="1" opacity=".22"/>
  <path d="M48 12 L78 24 V48 C78 66 64 80 48 86 C32 80 18 66 18 48 V24 Z" fill="#C4756A" opacity=".16" stroke="#C4756A" stroke-width="2.5"/><circle class="pulse" cx="48" cy="46" r="18" fill="none" stroke="#C4756A" stroke-width="2"/><circle class="pulse2" cx="48" cy="46" r="10" fill="none" stroke="#C4756A" stroke-width="2"/><circle cx="48" cy="46" r="3.5" fill="#C4756A"/>
</svg>
