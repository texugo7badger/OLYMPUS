<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Parthenon">
  <defs>
    <linearGradient id="pm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C79A"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <linearGradient id="pm-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD0D6"/>
      <stop offset="100%" stop-color="#5A9AA1"/>
    </linearGradient>
  </defs>
  <!-- pediment -->
  <path d="M5 17 L24 5 L43 17 Z" fill="url(#pm-gold)" fill-opacity="0.14" stroke="url(#pm-gold)" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- ten gods: five along each slope of the pediment -->
  <g fill="#D4A574">
    <circle cx="13" cy="15.2" r="0.9"/><circle cx="18" cy="13.2" r="0.9"/><circle cx="24" cy="12.2" r="0.9"/><circle cx="30" cy="13.2" r="0.9"/><circle cx="35" cy="15.2" r="0.9"/>
    <circle cx="15" cy="16.4" r="0.8"/><circle cx="20" cy="15.4" r="0.8"/><circle cx="28" cy="15.4" r="0.8"/><circle cx="33" cy="16.4" r="0.8"/><circle cx="24" cy="15.6" r="0.8"/>
  </g>
  <!-- entablature -->
  <rect x="6" y="17.6" width="36" height="2.8" rx="0.6" fill="url(#pm-gold)"/>
  <!-- eight columns: the canonical Parthenon front -->
  <g fill="url(#pm-teal)">
    <rect x="6.2" y="21" width="2" height="16" rx="0.4"/>
    <rect x="10.8" y="21" width="2" height="16" rx="0.4"/>
    <rect x="15.4" y="21" width="2" height="16" rx="0.4"/>
    <rect x="20" y="21" width="2" height="16" rx="0.4"/>
    <rect x="24.6" y="21" width="2" height="16" rx="0.4"/>
    <rect x="29.2" y="21" width="2" height="16" rx="0.4"/>
    <rect x="33.8" y="21" width="2" height="16" rx="0.4"/>
    <rect x="38.4" y="21" width="2" height="16" rx="0.4"/>
  </g>
  <!-- stylobate -->
  <rect x="5.4" y="37.6" width="37.2" height="2.2" rx="0.6" fill="url(#pm-gold)"/>
  <rect x="4.6" y="40.2" width="38.8" height="1.6" rx="0.5" fill="#D4A574" fill-opacity="0.55"/>
</svg>
