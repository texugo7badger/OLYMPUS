<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SECURITY IS A BOUNDARY, NOT A FEATURE — auth, secrets, permissions">
  <rect width="1200" height="360" rx="18" fill="#0B0C10"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" stroke="#2A2E38"/>
  <text x="40" y="52" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700" letter-spacing="1">SECURITY IS A BOUNDARY, NOT A FEATURE</text>
  <text x="40" y="76" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="11">auth, secrets, permissions</text>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#2A2E38"/>
  <rect x="40" y="120" width="300" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="40" y="120" width="3" height="140" rx="1.5" fill="#9CC48E"/>
  <text x="56" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">AUTH</text>
  <text x="56" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">local mode: loopback only</text>
  <text x="56" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">LAN/tunnel: bearer token</text>
  <text x="56" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">desktop: HttpOnly cookie</text>
  <rect x="380" y="120" width="300" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="380" y="120" width="3" height="140" rx="1.5" fill="#9CC48E"/>
  <text x="396" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">SECRETS</text>
  <text x="396" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">keys live in OpenCode</text>
  <text x="396" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">auth.json — never in OLYMPUS</text>
  <text x="396" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">no key field in the UI</text>
  <rect x="720" y="120" width="300" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="720" y="120" width="3" height="140" rx="1.5" fill="#E8A45C"/>
  <text x="736" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">PERMISSIONS</text>
  <text x="736" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">destructive asks are denied</text>
  <text x="736" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">in unattended hops</text>
  <text x="736" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">a backup precedes the gate</text>
  <text x="40" y="300" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">Every read route is auth-gated; the phone uses x-olympus-token, the desktop the cookie.</text>
  <text x="40" y="324" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">Report a vulnerability privately — see SECURITY.md. No secret ever enters a log, a commit or a screenshot.</text>
</svg>
