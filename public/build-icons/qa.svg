<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OLYMPUS qa build category">
  <defs>
    <style>
      .spin { transform-origin: 48px 48px; animation: spin 14s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.8s ease-in-out infinite; animation-delay: .6s; }
      .travel { animation: travel 3.2s ease-in-out infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes travel { 0%,100% { transform: translate(0,0); opacity: .4; } 50% { transform: translate(0,-18px); opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateY(-10px); opacity: .25; } 50% { transform: translateY(12px); opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .spin,.pulse,.pulse2,.travel,.scan { animation: none; } }
    </style>
  </defs>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#7BAE8E" stroke-width="1" opacity=".22"/>
  <path d="M48 12 L78 24 V48 C78 66 64 80 48 86 C32 80 18 66 18 48 V24 Z" fill="none" stroke="#7BAE8E" stroke-width="2.5" opacity=".8"/><path d="M34 48 L44 58 L64 36" fill="none" stroke="#7BAE8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="scan" x="22" y="40" width="52" height="2" fill="#7BAE8E" opacity=".6"/>
</svg>
