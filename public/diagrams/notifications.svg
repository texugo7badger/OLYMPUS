<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="OLYMPUS notifications follow the user's theme when the app is visible; the OS owns the background toast">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080B12"/><stop offset="1" stop-color="#0D1220"/></linearGradient>
    <style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.dim{fill:#8A93A6}.gold{fill:#D4A574}.cyan{fill:#6BAEB5}</style>
  </defs>
  <rect width="1200" height="360" fill="url(#nbg)"/>
  <text x="40" y="46" class="t gold" font-size="14" letter-spacing="5">OLYMPUS · NOTIFICATIONS</text>
  <text x="40" y="70" class="t dim" font-size="10">when the app is visible, the toast uses the palette you picked — not the OS theme</text>

  <!-- themed in-app toast -->
  <rect x="40" y="100" width="520" height="92" rx="12" fill="#10151F" stroke="#6BAEB555"/>
  <circle cx="72" cy="132" r="14" fill="#6BAEB51F" stroke="#6BAEB555"/>
  <text x="72" y="137" class="t cyan" font-size="11" text-anchor="middle">◈</text>
  <text x="96" y="128" class="t cyan" font-size="11" font-weight="bold">OLYMPUS — walk starting</text>
  <text x="96" y="146" class="t dim" font-size="9">aime: the plan is being walked (hops run on their gods' lanes).</text>
  <text x="96" y="162" class="t dim" font-size="8">click to open · auto-dismiss 7s · theme: Parchment</text>
  <rect x="40" y="192" width="520" height="3" rx="1.5" fill="#6BAEB5"/>
  <text x="40" y="222" class="t dim" font-size="9">IN-APP (visible) · palette bg/panel/text + the type accent</text>

  <!-- native -->
  <rect x="640" y="100" width="520" height="92" rx="12" fill="#1B1B1B" stroke="#3A3A3A"/>
  <circle cx="672" cy="132" r="14" fill="#2A2A2A" stroke="#4A4A4A"/>
  <text x="672" y="137" class="t dim" font-size="11" text-anchor="middle">◈</text>
  <text x="696" y="128" class="t dim" font-size="11" font-weight="bold">OLYMPUS — walk starting</text>
  <text x="696" y="146" class="t dim" font-size="9">aime: the plan is being walked…</text>
  <text x="696" y="162" class="t dim" font-size="8">GNOME notification · follows the SYSTEM theme</text>
  <text x="640" y="222" class="t dim" font-size="9">NATIVE (hidden) · the OS owns this surface — an honest limit</text>

  <text x="40" y="290" class="t gold" font-size="10" letter-spacing="2">WHY</text>
  <text x="40" y="312" class="t dim" font-size="10">a native toast cannot carry theme.json; the in-app card can. The tray dot still colors by type.</text>
  <text x="40" y="332" class="t dim" font-size="9">walk = cyan · ready = green · error = red · design = purple · compact = amber · curate = gold</text>
</svg>
