<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="OLYMPUS infra build category">
  <defs>
    <style>
      .spin { transform-origin: 48px 48px; animation: spin 14s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.8s ease-in-out infinite; animation-delay: .6s; }
      .travel { animation: travel 3.2s ease-in-out infinite; }
      .scan { animation: scan 2.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes travel { 0%,100% { transform: translate(0,0); opacity: .4; } 50% { transform: translate(0,-18px); opacity: 1; } }
      @keyframes scan { 0%,100% { transform: translateY(-10px); opacity: .25; } 50% { transform: translateY(12px); opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .spin,.pulse,.pulse2,.travel,.scan { animation: none; } }
    </style>
  </defs>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#C4A265" stroke-width="1" opacity=".22"/>
  <g class="spin"><circle cx="48" cy="48" r="16" fill="none" stroke="#C4A265" stroke-width="4"/><g stroke="#C4A265" stroke-width="4" stroke-linecap="round"><path d="M48 20 V12"/><path d="M48 76 V84"/><path d="M20 48 H12"/><path d="M76 48 H84"/><path d="M28 28 L22 22"/><path d="M68 68 L74 74"/><path d="M68 28 L74 22"/><path d="M28 68 L22 74"/></g></g><circle class="pulse" cx="48" cy="48" r="5" fill="#C4A265"/>
</svg>
