<!--
  OLYMPUS Logo — the CHAMELEON edition (v0.0.36)
  Same geometry as the original: the peak, Callimachus above, Atlas below,
  the eight specialist gods in orbit, two rings and eight rays.
  The colors are now a family, not a single accent: gold, red, cyan, green,
  amber, purple, teal and blue. The app recolors these per theme; this file
  is the static brand mark.
  © OLYMPUS Contributors — AGPL-3.0-or-later
-->
