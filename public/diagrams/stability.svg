<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WHAT KEEPS THE MACHINE ALIVE — four shields, one law: evidence or silence">
  <rect width="1200" height="360" rx="18" fill="#0B0C10"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" stroke="#2A2E38"/>
  <text x="40" y="52" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700" letter-spacing="1">WHAT KEEPS THE MACHINE ALIVE</text>
  <text x="40" y="76" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="11">four shields, one law: evidence or silence</text>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#2A2E38"/>
  <rect x="40" y="120" width="270" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="40" y="120" width="3" height="140" rx="1.5" fill="#9CC48E"/>
  <text x="56" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">WATCHDOG</text>
  <text x="56" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">a dead dev server is</text>
  <text x="56" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">probed and respawned;</text>
  <text x="56" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">the panel says why</text>
  <rect x="330" y="120" width="270" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="330" y="120" width="3" height="140" rx="1.5" fill="#9CC48E"/>
  <text x="346" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">CRASH ARMOR</text>
  <text x="346" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">uncaught exceptions are</text>
  <text x="346" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">contained; the renderer</text>
  <text x="346" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">survives and reports</text>
  <rect x="620" y="120" width="270" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="620" y="120" width="3" height="140" rx="1.5" fill="#9CC48E"/>
  <text x="636" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">SUPERVISOR</text>
  <text x="636" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">one detached process per</text>
  <text x="636" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">lane; the walk survives</text>
  <text x="636" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">the app (v0.0.73)</text>
  <rect x="910" y="120" width="250" height="140" rx="10" fill="#12141A" stroke="#2A2E38"/>
  <rect x="910" y="120" width="3" height="140" rx="1.5" fill="#E8A45C"/>
  <text x="926" y="146" fill="#E8E6E1" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700">SOAK · 8H</text>
  <text x="926" y="168" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">the RC gate: 0 lost hops,</text>
  <text x="926" y="186" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">RSS bounded, p50/p95</text>
  <text x="926" y="204" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">— still pending</text>
  <text x="40" y="300" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">Every status carries probe evidence (health, ss, pid) or says &#x27;unverified&#x27;. No narrated liveness.</text>
  <text x="40" y="324" fill="#9A968E" font-family="'JetBrains Mono',monospace" font-size="10.5">A park names its cause and resumes from disk; a budget (time or money) stops the walk with a named reason.</text>
</svg>
