<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OLYMPUS v0.0.60 — 60 FPS, the folder identity, and a 60-minute project budget: ten gods, one living machine, seven languages.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/><stop offset="55%" stop-color="#0B1020"/><stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity=".20"/><stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6BAEB5" stop-opacity=".16"/><stop offset="100%" stop-color="#6BAEB5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B7BAE" stop-opacity=".16"/><stop offset="100%" stop-color="#9B7BAE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A574"/><stop offset="34%" stop-color="#C4756A"/><stop offset="68%" stop-color="#9B7BAE"/><stop offset="100%" stop-color="#6BAEB5"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A574"/><stop offset="28%" stop-color="#C4A265"/><stop offset="52%" stop-color="#7BAE8E"/><stop offset="74%" stop-color="#6BAEB5"/><stop offset="100%" stop-color="#9B7BAE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="230" fill="url(#glowGold)"/>
  <circle cx="960" cy="80" r="240" fill="url(#glowCyan)"/>
  <circle cx="1080" cy="280" r="220" fill="url(#glowPurple)"/>

  <!-- The ORIGINAL OLYMPUS mark, chameleon edition: same geometry as logo.svg -->
  <g transform="translate(52,32) scale(0.98)">
    <circle cx="128" cy="128" r="124" fill="#0A0E16"/>
    <circle cx="128" cy="128" r="112" stroke="#D4A574" stroke-width="1.5" fill="none" opacity=".45"/>
    <circle cx="128" cy="128" r="96" stroke="#6BAEB5" stroke-width="1" fill="none" opacity=".35"/>
    <path d="M 128 76 L 168 168 L 144 168 L 128 132 L 112 168 L 88 168 Z" fill="url(#peak)"/>
    <circle cx="128" cy="60" r="4" fill="#9B7BAE"/>
    <circle cx="128" cy="168" r="4" fill="#D4A574"/>
    <circle cx="128" cy="24" r="5" fill="#D4A574"/>
    <circle cx="201.6" cy="54.4" r="4.2" fill="#C4756A" opacity=".9"/>
    <circle cx="232" cy="128" r="5" fill="#6BAEB5"/>
    <circle cx="201.6" cy="201.6" r="4.2" fill="#7BAE8E" opacity=".9"/>
    <circle cx="128" cy="232" r="5" fill="#C4A265"/>
    <circle cx="54.4" cy="201.6" r="4.2" fill="#9B7BAE" opacity=".9"/>
    <circle cx="24" cy="128" r="5" fill="#6BAE9B"/>
    <circle cx="54.4" cy="54.4" r="4.2" fill="#6B8FB5" opacity=".9"/>
    <g stroke="#D4A574" stroke-width="0.5" opacity=".16">
      <line x1="128" y1="128" x2="128" y2="24"/><line x1="128" y1="128" x2="201.6" y2="54.4"/>
      <line x1="128" y1="128" x2="232" y2="128"/><line x1="128" y1="128" x2="201.6" y2="201.6"/>
      <line x1="128" y1="128" x2="128" y2="232"/><line x1="128" y1="128" x2="54.4" y2="201.6"/>
      <line x1="128" y1="128" x2="24" y2="128"/><line x1="128" y1="128" x2="54.4" y2="54.4"/>
    </g>
  </g>

  <text x="360" y="132" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="82" font-weight="750" letter-spacing="6" fill="url(#word)">OLYMPUS</text>
  <text x="364" y="172" font-family="ui-monospace, 'SF Mono', monospace" font-size="13" letter-spacing="4" fill="#B8B8B8">TEN GODS · 122 DEMIGODS · 28 MCPs · ONE LIVING MACHINE</text>
  <text x="364" y="202" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" letter-spacing="1.5" fill="#7BAE8E">AGPL-3.0 · LOCAL-FIRST · 60 FPS · THE BRAIN NEVER FORGETS</text>

  <!-- Seven languages, the Settings row made visible -->
  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="11">
    <rect x="364" y="226" width="86" height="24" rx="12" fill="#D4A574" fill-opacity=".12" stroke="#D4A574" stroke-opacity=".35"/>
    <text x="407" y="242" text-anchor="middle" fill="#D4A574">English</text>
    <rect x="458" y="226" width="94" height="24" rx="12" fill="#6BAEB5" fill-opacity=".12" stroke="#6BAEB5" stroke-opacity=".35"/>
    <text x="505" y="242" text-anchor="middle" fill="#6BAEB5">Português</text>
    <rect x="560" y="226" width="82" height="24" rx="12" fill="#7BAE8E" fill-opacity=".12" stroke="#7BAE8E" stroke-opacity=".35"/>
    <text x="601" y="242" text-anchor="middle" fill="#7BAE8E">Español</text>
    <rect x="650" y="226" width="82" height="24" rx="12" fill="#C4756A" fill-opacity=".12" stroke="#C4756A" stroke-opacity=".35"/>
    <text x="691" y="242" text-anchor="middle" fill="#C4756A">Français</text>
    <rect x="740" y="226" width="82" height="24" rx="12" fill="#C4A265" fill-opacity=".12" stroke="#C4A265" stroke-opacity=".35"/>
    <text x="781" y="242" text-anchor="middle" fill="#C4A265">Deutsch</text>
    <rect x="830" y="226" width="76" height="24" rx="12" fill="#9B7BAE" fill-opacity=".12" stroke="#9B7BAE" stroke-opacity=".35"/>
    <text x="868" y="242" text-anchor="middle" fill="#9B7BAE">日本語</text>
    <rect x="914" y="226" width="62" height="24" rx="12" fill="#6BAE9B" fill-opacity=".12" stroke="#6BAE9B" stroke-opacity=".35"/>
    <text x="945" y="242" text-anchor="middle" fill="#6BAE9B">中文</text>
  </g>

  <g font-family="ui-monospace, 'SF Mono', monospace" font-size="11">
    <text x="1030" y="242" fill="#D4A574" font-weight="700">v0.0.60</text>
    <text x="1030" y="260" fill="#7A7F88">remote companion + one loader</text>
  </g>
