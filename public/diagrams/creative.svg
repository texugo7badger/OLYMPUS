<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="OLYMPUS creative mode: progress, plasma ring, build crystal, queue and feed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/><stop offset="1" stop-color="#0D1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A574"/><stop offset="1" stop-color="#6BAEB5"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A574"/><stop offset="0.5" stop-color="#9B7BAE"/><stop offset="1" stop-color="#6BAEB5"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6BAEB5" stop-opacity="0.22"/><stop offset="1" stop-color="#6BAEB5" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .dim { fill: #8A93A6; }
      .gold { fill: #D4A574; }
      .cyan { fill: #6BAEB5; }
      .purple { fill: #9B7BAE; }
      .green { fill: #7BAE8E; }
      .panel { fill: #10151F; stroke: #D4A57433; }
      .bar { fill: #1A2030; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="40" y="52" class="t gold" font-size="15" letter-spacing="5">OLYMPUS · CREATIVE MODE</text>
  <text x="40" y="76" class="t dim" font-size="11" letter-spacing="2">progress is of the CURRENT plan — a new prompt can lower it because the plan grew</text>

  <!-- LEFT: progress -->
  <rect x="40" y="104" width="360" height="540" rx="14" class="panel"/>
  <text x="64" y="136" class="t gold" font-size="11" letter-spacing="3">PROJECT PROGRESS</text>
  <text x="360" y="140" class="t cyan" font-size="26" text-anchor="end" font-weight="bold">62%</text>
  <rect x="64" y="156" width="312" height="10" rx="5" class="bar"/>
  <rect x="64" y="156" width="193" height="10" rx="5" fill="url(#gold)"/>
  <text x="64" y="188" class="t dim" font-size="10">26 / 42 hops · 2 running · 1 parked</text>
  <text x="376" y="188" class="t dim" font-size="10" text-anchor="end">31 / 48 artifacts</text>

  <text x="64" y="222" class="t dim" font-size="9" letter-spacing="2">PER GOD — TAP A BAR TO ASK THAT GOD WHY</text>
  <g class="t">
    <text x="64" y="252" class="purple" font-size="10">athena</text><text x="376" y="252" class="dim" font-size="9" text-anchor="end">75%</text>
    <rect x="64" y="260" width="312" height="6" rx="3" class="bar"/><rect x="64" y="260" width="234" height="6" rx="3" fill="#9B7BAE"/>
    <text x="64" y="290" class="gold" font-size="10">apollo</text><text x="376" y="290" class="dim" font-size="9" text-anchor="end">100%</text>
    <rect x="64" y="298" width="312" height="6" rx="3" class="bar"/><rect x="64" y="298" width="312" height="6" rx="3" fill="#D4A574"/>
    <text x="64" y="328" class="green" font-size="10">persephone</text><text x="376" y="328" class="dim" font-size="9" text-anchor="end">50%</text>
    <rect x="64" y="336" width="312" height="6" rx="3" class="bar"/><rect x="64" y="336" width="156" height="6" rx="3" fill="#7BAE8E"/>
    <text x="64" y="366" class="cyan" font-size="10">hermes</text><text x="376" y="366" class="dim" font-size="9" text-anchor="end">40%</text>
    <rect x="64" y="374" width="312" height="6" rx="3" class="bar"/><rect x="64" y="374" width="125" height="6" rx="3" fill="#6BAEB5"/>
    <text x="64" y="404" class="gold" font-size="10">hephaestus</text><text x="376" y="404" class="dim" font-size="9" text-anchor="end">66%</text>
    <rect x="64" y="412" width="312" height="6" rx="3" class="bar"/><rect x="64" y="412" width="206" height="6" rx="3" fill="#6B8FB5"/>
  </g>
  <rect x="64" y="452" width="312" height="1" fill="#D4A57422"/>
  <text x="64" y="480" class="t gold" font-size="10" letter-spacing="2">SIZE — THE PROJECT GROWING</text>
  <text x="64" y="504" class="t dim" font-size="10">31 artifacts delivered · 48 planned</text>
  <text x="64" y="524" class="t dim" font-size="10">+3 artifacts since the last prompt</text>
  <text x="64" y="556" class="t cyan" font-size="10">explain · “why 62%?” → the god answers</text>
  <text x="64" y="572" class="t dim" font-size="9">spoken in the user's language, citing these numbers</text>
  <rect x="64" y="596" width="312" height="30" rx="8" fill="#D4A5741A" stroke="#D4A57455"/>
  <text x="220" y="616" class="t gold" font-size="10" text-anchor="middle">EXPLAIN PROGRESS</text>

  <!-- CENTER: plasma ring -->
  <circle cx="600" cy="360" r="190" fill="url(#aura)"/>
  <circle cx="600" cy="360" r="150" fill="none" stroke="#6BAEB5" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="600" cy="360" r="160" fill="none" stroke="#9B7BAE" stroke-opacity="0.28" stroke-width="1.2"/>
  <circle cx="600" cy="360" r="170" fill="none" stroke="#D4A574" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="600" cy="360" r="78" fill="#0A0F18" stroke="#6BAEB555"/>
  <text x="600" y="352" class="t cyan" font-size="11" text-anchor="middle">MIC</text>
  <text x="600" y="370" class="t dim" font-size="8" text-anchor="middle">hold</text>
  <text x="600" y="560" class="t gold" font-size="12" text-anchor="middle" letter-spacing="3">HOLD THE MIC · SPEAK · RELEASE</text>
  <text x="600" y="582" class="t dim" font-size="10" text-anchor="middle">the ring reads the real level — yours, then the god's voice</text>
  <text x="600" y="604" class="t dim" font-size="9" text-anchor="middle">server STT · browser fallback · slide away to cancel</text>

  <!-- RIGHT: crystal + queue + feed -->
  <rect x="800" y="104" width="360" height="250" rx="14" class="panel"/>
  <text x="824" y="136" class="t gold" font-size="11" letter-spacing="3">THE BUILD IS A CRYSTAL</text>
  <g transform="translate(880 210)">
    <polygon points="0,-56 34,-14 0,8 -34,-14" fill="url(#gem)" fill-opacity="0.95" stroke="#6BAEB5" stroke-opacity="0.4"/>
    <polygon points="-34,-14 34,-14 0,56" fill="url(#gem)" fill-opacity="0.7" stroke="#6BAEB5" stroke-opacity="0.35"/>
    <polyline points="0,-56 34,-14 0,8 -34,-14" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
  </g>
  <text x="960" y="190" class="t cyan" font-size="11">athena · frontend-reviewer</text>
  <text x="960" y="210" class="t dim" font-size="9">model opencode-go/qwen3.7-plus</text>
  <text x="960" y="226" class="t dim" font-size="9">strategy go-balanced · temp 0.7</text>
  <text x="960" y="242" class="t dim" font-size="9">3 skills · 2 MCPs · 2 demigods</text>
  <text x="824" y="300" class="t dim" font-size="9">each build gets its own cut, in the theme's colors</text>
  <text x="824" y="318" class="t dim" font-size="9">the editor lets you pick the cut — phone and PC</text>

  <rect x="800" y="370" width="360" height="274" rx="14" class="panel"/>
  <text x="824" y="402" class="t gold" font-size="11" letter-spacing="3">DEVELOPMENT FEED</text>
  <g class="t">
    <circle cx="830" cy="424" r="3" fill="#6BAEB5"/><text x="842" y="428" class="dim" font-size="9">walk starting · aime</text>
    <circle cx="830" cy="446" r="3" fill="#7BAE8E"/><text x="842" y="450" class="dim" font-size="9">sakuga-2-references · athena · done</text>
    <circle cx="830" cy="468" r="3" fill="#9B7BAE"/><text x="842" y="472" class="dim" font-size="9">design choice · editorial night</text>
    <circle cx="830" cy="490" r="3" fill="#C4A265"/><text x="842" y="494" class="dim" font-size="9">x2-energy-module · parked · budget</text>
  </g>
  <text x="824" y="530" class="t gold" font-size="11" letter-spacing="3">PROMPT QUEUE</text>
  <rect x="824" y="542" width="250" height="28" rx="7" fill="#0A0F18" stroke="#D4A57433"/>
  <text x="836" y="560" class="t dim" font-size="9">enqueue a request for the project…</text>
  <rect x="1082" y="542" width="54" height="28" rx="7" fill="#D4A5741A" stroke="#D4A57455"/>
  <text x="1109" y="560" class="t gold" font-size="9" text-anchor="middle">ADD</text>
  <text x="824" y="594" class="t dim" font-size="9">queued · “fix the deck ordering”</text>
  <text x="824" y="612" class="t cyan" font-size="9">send now → Apollo</text>
  <text x="824" y="632" class="t dim" font-size="8">the queue is a user file; an unsent item is not a lost hop</text>
</svg>
